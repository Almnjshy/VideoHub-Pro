# VideoHub Pro — Native Android APK Build
# Builds APK with embedded yt-dlp (via Chaquopy 17 + Python 3.11)
name: Android APK Build

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
    tags: ['v*']
  pull_request:
    branches: [main, master]
    paths:
      - 'android/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      # Python is required by Chaquopy to install pip packages at build time
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: chmod +x ./gradlew
      - run: ./gradlew lintDebug --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: android/app/build/reports/
          retention-days: 7

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      # Python is required by Chaquopy to install pip packages at build time
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug --stacktrace
      - run: |
          mkdir -p outputs
          cp app/build/outputs/apk/debug/*.apk outputs/videohub-pro-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: videohub-pro-debug-apk
          path: android/outputs/*.apk
          retention-days: 30

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build-debug
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      # Python is required by Chaquopy to install pip packages at build time
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: chmod +x ./gradlew

      # ✅ Use env instead of if with secrets (secrets context is not allowed in job-level if)
      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "signing.keystore=release.keystore" >> local.properties
            echo "signing.alias=${{ secrets.SIGNING_KEY_ALIAS }}" >> local.properties
            echo "signing.password=${{ secrets.SIGNING_KEY_PASSWORD }}" >> local.properties
            echo "signing.storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> local.properties
          fi

      - run: ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - run: |
          mkdir -p outputs
          cp app/build/outputs/apk/release/*.apk outputs/
      - uses: actions/upload-artifact@v4
        with:
          name: videohub-pro-release-apk
          path: android/outputs/*.apk
          retention-days: 90

  build-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      # Python is required by Chaquopy to install pip packages at build time
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - run: chmod +x ./gradlew

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          fi

      - run: ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: videohub-pro-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-release, build-aab]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release-assets
          find artifacts -name "*.apk" -exec cp {} release-assets/ \;
          find artifacts -name "*.aab" -exec cp {} release-assets/ \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VideoHub Pro ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
